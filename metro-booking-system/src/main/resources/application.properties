# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8080}

# ===============================
# H2 DATABASE CONFIG
# ===============================
#spring.datasource.url=jdbc:h2:file:./data/metrodb;AUTO_SERVER=TRUE
spring.datasource.url=jdbc:h2:mem:metrodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SQL INITIALIZATION
# ===============================
spring.sql.init.mode=embedded
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===============================
# CORS CONFIG
# ===============================
# Change port to use Render's dynamic port
# Update CORS to allow Render URL (add your render URL after deploying)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5175,http://localhost:3000,https://metro-booking-system.onrender.com,https://metro-service-frontend.vercel.app,https://color-light-relief-hollow.trycloudflare.com,https://vercel.com/ramasaijahnavis-projects/metro-service-booking/deployments,https://metro-booking-frontend-production-92f1.up.railway.app

